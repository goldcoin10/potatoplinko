<html><head><title>Potato Plinko</title><style>canvas{border:1px solid black;background-color:tan;}</style></head><body><canvas id="canvas" width="640" height="480"></canvas><script>const c=document.getElementById("canvas").getContext("2d"),p=new Image(),v=390,k=10;let m=170,n=0,s=0;const z=()=>requestAnimationFrame(l);p.src="pto.png";c.imageSmoothingEnabled=false;c.font="32px monospace";const l=()=>{c.clearRect(0,0,canvas.width,canvas.height);for(i=1;i<5;i++)c.fillText("|",i*128,480);if(m>450)m=450;if(m<0)m=0;if(n<v){c.drawImage(p,m,n,96,96);n=n+1;((Math.random())>0.5)?m=m-Math.random()*k:m=(Math.random()*k)+m;z();}else{c.drawImage(p,(Math.round(m/128)*128),v,96,96);if(m<128||m>512)s++;else if(m<256)s+=5;else if(m<384)s+=10;else if(m<512)s+=5;else s++;c.fillText(s,170,25);m=170;setTimeout(()=>{n=0;m=170;z()},1000);}};p.onload=()=>z();</script></body></html>
